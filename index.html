        if (debt.priceKey) {
          const q = live[debt.priceKey];
          debtUSD = q && q.price > 0 ? debt.amount * q.price : debt.valueUSD;
        } else {
          debtUSD = debt.currency === 'EUR' ? debt.amount * fx : debt.amount;
        }
      }
      if (debtUSD > 0) {
        const preferred = debt.tokenSymbol ? null : debt.currency;
        const cash = holdings.filter((h) => (h.symbol === 'USD' || h.symbol === 'EUR') && h.valueUSD > 0);
        const byValue = (a, b) => b.valueUSD - a.valueUSD;
        let remaining = debtUSD;
        for (const h of cash.filter((c) => c.symbol === preferred).sort(byValue).concat(cash.filter((c) => c.symbol !== preferred).sort(byValue))) {
          if (remaining <= 0) break;
          const absorb = Math.min(remaining, h.valueUSD);
          h.effectiveValueUSD = h.valueUSD - absorb;
          h.grossValueUSD = h.valueUSD;
          h.freeCashUSD = h.effectiveValueUSD;
          remaining -= absorb;
        }
      }

      let totalValue = 0, prev = 0, now = 0, basis = 0, basisCurrent = 0, apyBase = 0, apyEarnings = 0;
      for (const h of holdings) {
        totalValue += finite(h.valueUSD) ? h.valueUSD : 0;
        if (finite(h.priceUSD) && h.priceUSD > 0) {
          const c = !h.isCash && finite(h.changePct1D) ? h.changePct1D : 0;
          prev += h.priceUSD / (1 + c / 100) * h.amount;
          now += h.priceUSD * h.amount;
        }
        if (!h.isCash && h.avgPriceUSD > 0) {
          basis += h.amount * h.avgPriceUSD;
          basisCurrent += h.valueUSD;
        }
        if (h.apyPct > 0) {
          apyBase += h.valueUSD;
          apyEarnings += h.apyEarnings30DUSD || 0;
        }
      }
      const netWorth = totalValue - debtUSD;
      const change24h = prev > 0 ? (now - prev) / prev * 100 : null;
      const totalReturnPct = basis > 0 ? (basisCurrent - basis) / basis * 100 : null;
      const weightedApy = apyBase > 0 ? apyEarnings / apyBase * 365 / 30 * 100 : null;

      // Portfolio chart: the phone's series for this timeframe with the
      // right edge moved to the live net worth.
      const range = (base.rangeOptions || ['1H', '4H', '1D', '1W', '1M', 'ALL']).includes(cloud.range) ? cloud.range : base.rangeLabel;
      const phoneSeries = chosen ? {} : (snap.series || {});
      let points = (phoneSeries[range] || (!chosen && range === base.rangeLabel ? base.portfolioSparkline : []) || []).slice();
      let historyLoading = false;
      if (points.length < 2 && RANGE_SPEC[range]) {
        const built = cloud.built[profileKey + '|' + range];
        if (built && built.points.length >= 2) points = built.points.slice();
        else historyLoading = true;
        // Fetch (or refresh) after this render; ensureHistory re-renders.
        setTimeout(() => ensureHistory(range, profileKey), 0);
      }
      if (chosen && !cloud.built[profileKey + '|1D']) setTimeout(() => ensureHistory('1D', profileKey), 0);
      if (points.length >= 2) {
        const nowT = Date.now() / 1000;
        const last = points[points.length - 1];
        if (nowT - last.t < 120) points[points.length - 1] = { t: nowT, v: netWorth };
        else points.push({ t: nowT, v: netWorth });
      }
      let rangeChangePct = null, rangeChangeUSD = null;
      if (range === 'ALL') {
        if (basis > 0) { rangeChangeUSD = basisCurrent - basis; rangeChangePct = rangeChangeUSD / basis * 100; }
      } else if (points.length >= 2 && points[0].v > 0) {
        rangeChangeUSD = points[points.length - 1].v - points[0].v;
        rangeChangePct = rangeChangeUSD / points[0].v * 100;
      }

      for (const h of holdings) {
        const unitPrice = h.priceUSD;
        const redundantCash = !denomOn() && h.isCash && h.symbol === shownCash;
        const amount = fmtCompactAmount(h.amount);
        let unit = amount + ' ' + h.symbol;
        if (unitPrice > 0 && !redundantCash) unit += ' · ' + (h.isCash ? fmtCashRate(h.symbol, unitPrice) : fmtCompactPrice(unitPrice));
        const selfDenominated = denomOn() && display.denominationSymbol === h.symbol;
        h.text = {
          unit,
          amount,
          price: unitPrice > 0 ? (h.isCash ? fmtCashRate(h.symbol, unitPrice) : fmtPrice(unitPrice)) : DASH,
          value: !(unitPrice > 0) && h.effectiveValueUSD <= 0 ? DASH
            : selfDenominated ? amount + ' ' + h.symbol : fmtCompactUSD(h.effectiveValueUSD),
          gross: finite(h.grossValueUSD) && h.grossValueUSD > h.effectiveValueUSD + 0.5 ? 'of ' + fmtCompactUSD(h.grossValueUSD) : null,
          change: finite(h.changePct1D) ? fmtPct(h.changePct1D) : null,
          pnl: finite(h.pnlPctVsCost) ? fmtPct(h.pnlPctVsCost) : null,
          yield30D: h.apyEarnings30DUSD > 0 ? fmtCompactUSD(h.apyEarnings30DUSD) : null
        };
      }
      holdings.sort((a, b) => b.effectiveValueUSD - a.effectiveValueUSD);

      const watches = (base.watches || []).map((w) => {
        const q = w.isCash ? null : live[w.priceKey];
        const price = w.symbol === 'EUR' && w.isCash ? fx : w.symbol === 'USD' && w.isCash ? 1 : (q && q.price > 0 ? q.price : w.priceUSD);
        const change = q && finite(q.change) ? q.change : changeOf(w);
        const cap = q && q.marketCap > 0 ? q.marketCap : w.marketCapUSD;
        return Object.assign({}, w, liveStats(w, q), {
          priceUSD: price, changePct1D: change, marketCapUSD: cap,
          sparkline: q ? patchSpark(w.sparkline, price) : w.sparkline,
          text: {
            price: price > 0 ? (w.isCash ? fmtCashRate(w.symbol, price) : fmtPrice(price)) : DASH,
            change: finite(change) ? fmtPct(change) : null,
            marketCap: cap > 0 ? fmtCompactUSD(cap) : null
          }
        });
      });

      return Object.assign({}, base, {
        display,
        rangeLabel: range,
        hasProfileImage: false,
        profiles: [],
        holdings,
        watches,
        allocation: holdings.filter((h) => h.effectiveValueUSD > 0).map((h) => ({
          symbol: h.symbol, name: h.displayName, valueUSD: h.effectiveValueUSD, tint: h.tint
        })),
        portfolioSparkline: points,
        summary: Object.assign({}, base.summary, {
          netWorthUSD: netWorth,
          netWorthDisplay: fmtNetWorth(netWorth),
          totalValueUSD: totalValue,
          debtUSD,
          changePct24h: change24h,
          rangeChangePct,
          rangeChangeUSD,
          totalPnLPctVsCost: totalReturnPct,
          totalApyEarnings30DUSD: apyEarnings,
          weightedApyPct: weightedApy,
          isLoadingChart: historyLoading,
          text: {
            totalValue: fmtCompactUSD(totalValue),
            debt: debtUSD > 0 ? '−' + fmtCompactUSD(debtUSD) : null,
            costBasis: basis > 0 ? fmtCompactUSD(basis) : null,
            totalReturnPct: finite(totalReturnPct) ? fmtPct(totalReturnPct) : null,
            totalReturnUSD: basis > 0 ? fmtSignedPillUSD(basisCurrent - basis) : null,
            rangeChangeUSD: finite(rangeChangeUSD) ? fmtSignedPillUSD(rangeChangeUSD) : null,
            rangeChangePct: finite(rangeChangePct) ? fmtPct(rangeChangePct) : null,
            yield30D: apyEarnings > 0 ? fmtCompactUSD(apyEarnings) : null,
            apy: finite(weightedApy) ? fmtPct(weightedApy, false) : null,
            change24h: finite(change24h) ? fmtPct(change24h) : null,
            hasApy: holdings.some((h) => h.apyPct > 0)
          }
        })
      });
    }
    async function cloudTick() {
      if (inFlight) return;
      inFlight = true;
      let changed = false;
      try {
        const nowMs = Date.now();
        if (!cloud.payload || nowMs - cloud.lastSnapshotCheck >= SNAPSHOT_EVERY) {
          cloud.lastSnapshotCheck = nowMs;
          try { changed = (await refreshSnapshot()) || changed; } catch (_) { if (!cloud.payload) throw _; }
        }
        if (nowMs - cloud.lastIconsCheck >= ICONS_EVERY) {
          cloud.lastIconsCheck = nowMs;
          try { changed = (await refreshIcons()) || changed; } catch (_) {}
        }
        const ok = await refreshPrices(nowMs - cloud.lastCG >= CG_EVERY);
        failures = ok ? 0 : failures + 1;
        state = computeCloudState();
        render();
        if (!detail.routed) { detail.routed = true; syncRoute(); }
      } catch (_) {
        failures += 1;
        if (state) render(); else renderStatus();
      } finally {
        inFlight = false;
        if (cloud.waiting) {
          cloud.lastSnapshotCheck = 0;
          schedule(10000);
        } else {
          schedule(failures ? Math.min(30000, BINANCE_EVERY * Math.pow(2, Math.min(failures, 3))) : BINANCE_EVERY);
        }
      }
    }
    async function cloudBoot() {
      // Paint the last snapshot this browser saw right away, then refresh.
      const cachedSnapshot = storageGet('PriceCloudSnapshot.' + cloudParams.record, '');
      const cachedIcons = storageGet('PriceCloudIcons.' + cloudParams.record, '');
      try { if (cachedIcons) { cloud.icons = await openSealed(cachedIcons); iconsVersion += 1; } } catch (_) {}
      try {
        if (cachedSnapshot) {
          cloud.payload = await openSealed(cachedSnapshot);
          state = computeCloudState();
          render();
        }
      } catch (_) {}
      cloudTick();
    }

    function boot() {
      portfolioChart = makeChart($('chart'), 'pf');
      wireDetail();
      wireTables();
      const stop = (message) => {
        linkExpired = true;
        linkMessage = message;
        renderStatus();
      };
      if (!cloudParams || !cloudParams.key) return stop('Open your dashboard link from Price on your iPhone');
      if (!window.crypto || !crypto.subtle || typeof DecompressionStream === 'undefined') return stop('This browser is too old');
      cloudBoot();
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) clearTimeout(pollTimer);
        else cloudTick();
      });
      // A dashboard tab can stay open for days: pick up new deploys by
      // itself (GitHub Pages lets browsers cache the page for 10 minutes).
      if (!BUILD.startsWith('__')) {
        setInterval(async () => {
          if (document.hidden) return;
          try {
            const res = await fetch('version.txt?t=' + Date.now(), { cache: 'no-store' });
            const latest = res.ok ? (await res.text()).trim() : '';
            if (latest && latest !== BUILD) location.reload();
          } catch (_) {}
        }, 600000);
      }
      const rerender = () => { if (state) { portfolioChart.sig = ''; render(); } };
      if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', rerender);
      if (prefersLight.addEventListener) {
        prefersLight.addEventListener('change', () => { if (cloud.payload) { state = computeCloudState(); rerender(); } });
      }
    }
    boot();
  })();
  </script>
</body>
</html>
