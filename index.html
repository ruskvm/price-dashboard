<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#000000" id="themeColorMeta">
  <meta name="referrer" content="no-referrer">
  <!-- The always-on copy may only talk to CloudKit and the two price APIs;
       nothing else can receive the decrypted portfolio. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.apple-cloudkit.com https://api.binance.com https://api.binance.us https://api.coingecko.com; base-uri 'none'; form-action 'none'">
  <title>Price</title>
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="assets/manrope-bold.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    /* Mirrors the iOS app's design system (AppTheme / PriceTypography):
       one Manrope Bold face, a flat canvas, solid surfaces with no blur,
       gradient or shadow, monochrome controls and the user's trend colours. */
    @font-face {
      font-family: "Price Manrope";
      src: url("assets/manrope-bold.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
      --canvas: #000000;
      --surface: #1B1B1B;
      --raised: #282828;
      --text: #F5F5F5;
      --secondary: #A0A0A0;
      --muted: rgba(245, 245, 245, 0.55);
      --faint: rgba(245, 245, 245, 0.25);
      --separator: rgba(255, 255, 255, 0.10);
      --hairline: rgba(255, 255, 255, 0.07);
      --fill: rgba(255, 255, 255, 0.08);
      --row-hover: rgba(255, 255, 255, 0.04);
      --ink: #FFFFFF;
      --on-ink: #000000;
      --tooltip: rgba(30, 30, 30, 0.84);
      --up: #00D222;
      --down: #FF2C2C;
      --usd: #30D158;
      --eur: #0A84FF;
      --radius: 16px;
      --font: "Price Manrope", "Manrope", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --canvas: #FBFCF9;
      --surface: #F0F2EE;
      --raised: #E9ECE6;
      --text: #171A18;
      --secondary: #71796F;
      --muted: rgba(23, 26, 24, 0.55);
      --faint: rgba(23, 26, 24, 0.25);
      --separator: rgba(0, 0, 0, 0.10);
      --hairline: rgba(0, 0, 0, 0.07);
      --fill: rgba(0, 0, 0, 0.06);
      --row-hover: rgba(0, 0, 0, 0.03);
      --ink: #000000;
      --on-ink: #FFFFFF;
      --tooltip: rgba(240, 242, 238, 0.88);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; }
    body {
      min-height: 100vh;
      background: var(--canvas);
      color: var(--text);
      font-family: var(--font);
      font-weight: 700;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    button, select { font: inherit; color: inherit; }
    h1, h2, p { margin: 0; font-weight: inherit; }
    :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; border-radius: 8px; }
    .num { font-variant-numeric: tabular-nums; }
    .up { color: var(--up); }
    .down { color: var(--down); }
    .muted { color: var(--muted); }

    .app {
      max-width: 1720px;
      margin: 0 auto;
      padding: 14px clamp(16px, 2vw, 32px) 28px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 56px;
      margin-bottom: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-icon { width: 30px; height: 30px; border-radius: 7px; display: block; }
    .brand-name { font-size: 22px; letter-spacing: -0.6px; }
    .top-actions { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--secondary);
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--secondary);
      transition: background-color 0.2s ease;
    }
    /* Nothing to say while everything works; only problems surface. */
    .status[data-state="live"] { display: none; }
    .status a { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .status[data-state="offline"] .status-dot,
    .status[data-state="expired"] .status-dot { background: var(--down); }
    .profile { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface);
      display: grid;
      place-items: center;
      overflow: hidden;
      flex: 0 0 auto;
      font-size: 14px;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .select-pill { position: relative; min-width: 0; }
    .select-pill select {
      appearance: none;
      -webkit-appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--fill);
      color: var(--text);
      font-size: 14px;
      padding: 8px 32px 8px 14px;
      max-width: 240px;
      cursor: pointer;
      text-overflow: ellipsis;
    }
    .select-pill select:hover { background: var(--separator); }
    /* Browsers treat a clicked <select> as keyboard focus and ring it; a
       tone shift reads as focus without the white outline. */
    .select-pill select:focus,
    .select-pill select:focus-visible { outline: none; box-shadow: none; background: var(--separator); }
    .select-pill::after {
      content: "";
      position: absolute;
      right: 14px;
      top: 50%;
      width: 6px;
      height: 6px;
      border-right: 2px solid var(--muted);
      border-bottom: 2px solid var(--muted);
      transform: translateY(-70%) rotate(45deg);
      pointer-events: none;
    }
    .profile-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }

    /* Layout */
    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "hero" "overview" "holdings" "watchlist";
      gap: 20px;
    }
    .hero { grid-area: hero; }
    .overview { grid-area: overview; }
    .holdings { grid-area: holdings; }
    .watchlist { grid-area: watchlist; }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      min-width: 0;
    }
    .section-head { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .section-head h2 { font-size: 20px; letter-spacing: -0.2px; }
    .count { font-size: 15px; color: var(--secondary); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .micro {
      font-size: 10px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    /* Hero: same stack as the Portfolio tab */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      min-width: 0;
      padding-top: 6px;
    }
    .hero-label { font-size: 13px; color: var(--secondary); text-align: center; }
    .net {
      font-size: clamp(44px, 4.8vw, 74px);
      letter-spacing: -0.045em;
      line-height: 1.16;
      text-align: center;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }
    .change {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 6px;
      min-height: 22px;
      margin-top: 4px;
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .change .chg-usd, .change .chg-tf { color: var(--muted); }
    .change .chg-tf { font-size: 11px; }
    .change .chg-group { display: inline-flex; align-items: baseline; gap: 4px; }

    .chart {
      position: relative;
      height: 220px;
      margin: 26px -4px 18px;
      touch-action: pan-y;
      cursor: crosshair;
      transition: opacity 0.2s ease;
    }
    .chart-body { position: absolute; inset: 0; }
    .chart-body svg, .chart-overlay { display: block; overflow: visible; }
    .chart-overlay { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    .chart-svg.reveal { animation: chartReveal 0.45s ease-out both; }
    @keyframes chartReveal {
      from { clip-path: inset(0 100% 0 0); opacity: 0.35; }
      to { clip-path: inset(0 0 0 0); opacity: 1; }
    }
    .baseline { stroke: var(--text); stroke-opacity: 0.16; stroke-width: 1; stroke-dasharray: 4 5; }
    .chart-overlay { pointer-events: none; opacity: 0; }
    .chart.hovering .chart-overlay { opacity: 1; }
    .chart-overlay .cross-v { stroke-width: 1; stroke-dasharray: 3 4; }
    .chart-overlay .cross-h { stroke: var(--text); stroke-opacity: 0.2; stroke-width: 1; stroke-dasharray: 3 4; }
    .chart-dot, .chart-live {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }
    .chart-dot {
      width: 11px;
      height: 11px;
      background: var(--dot-color, var(--up));
      box-shadow: 0 0 0 2px var(--canvas), 0 0 8px var(--dot-glow, transparent);
      opacity: 0;
    }
    .chart.hovering .chart-dot { opacity: 1; }
    .chart-live {
      width: 10px;
      height: 10px;
      background: var(--dot-color, var(--up));
      box-shadow: 0 0 0 2px var(--canvas), 0 0 5px var(--dot-glow, transparent);
      transition: opacity 0.15s ease;
    }
    .chart-live::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 12px;
      height: 12px;
      margin: -6px 0 0 -6px;
      border-radius: 50%;
      border: 1px solid var(--dot-color, var(--up));
      opacity: 0;
    }
    .chart-live.pulse::after { animation: livePulse 0.9s cubic-bezier(0.2, 0.7, 0.3, 1) 1; }
    @keyframes livePulse {
      0% { transform: scale(1); opacity: 0.6; }
      100% { transform: scale(1.85); opacity: 0; }
    }
    .chart.hovering .chart-live, .chart.no-series .chart-live { opacity: 0; }
    .chart-tip {
      position: absolute;
      left: 0;
      top: 0;
      padding: 6px 11px;
      border-radius: 12px;
      background: var(--tooltip);
      -webkit-backdrop-filter: blur(20px) saturate(1.4);
      backdrop-filter: blur(20px) saturate(1.4);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 18%, transparent);
      text-align: center;
      pointer-events: none;
      white-space: nowrap;
      opacity: 0;
      transform: translate(-50%, -50%);
      z-index: 2;
    }
    .chart.hovering .chart-tip { opacity: 1; }
    .tip-value { font-size: 13px; font-variant-numeric: tabular-nums; }
    .tip-date { font-size: 10px; color: color-mix(in srgb, var(--text) 70%, transparent); margin-top: 1px; font-variant-numeric: tabular-nums; }
    .chart-empty {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--secondary);
      font-size: 12px;
      cursor: default;
    }

    /* Segmented control: the app's monochrome picker — solid ink pill,
       inverse label, no tint. */
    .range-row { display: flex; justify-content: center; padding: 0 4px; }
    .segmented {
      --count: 6;
      --index: 0;
      position: relative;
      display: grid;
      grid-template-columns: repeat(var(--count), minmax(0, 1fr));
      width: min(100%, 380px);
      padding: 2px;
      border-radius: 999px;
      background: var(--fill);
      isolation: isolate;
    }
    .segmented.small { width: auto; grid-template-columns: repeat(var(--count), auto); }
    .seg-thumb {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: calc((100% - 4px) / var(--count));
      border-radius: 999px;
      background: var(--ink);
      transform: translateX(calc(var(--index) * 100%));
      transition: transform 0.28s cubic-bezier(0.3, 0.7, 0.2, 1);
      z-index: -1;
    }
    .segmented.small .seg-thumb { display: none; }
    .seg {
      appearance: none;
      border: 0;
      background: transparent;
      border-radius: 999px;
      color: var(--text);
      font-size: 12px;
      line-height: 1;
      padding: 8px 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s ease;
    }
    .seg[aria-checked="true"] { color: var(--on-ink); }
    .segmented.small .seg { font-size: 11px; padding: 7px 11px; }
    .segmented.small .seg[aria-checked="true"] { background: var(--ink); }

    /* Overview card */
    .overview { padding: 20px; display: flex; flex-direction: column; gap: 22px; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px 16px; }
    .stat { min-width: 0; }
    .stat-value {
      font-size: 20px;
      letter-spacing: -0.3px;
      margin-top: 7px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-value.none { color: var(--faint); }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .divider { height: 1px; background: var(--separator); }
    .allocation { display: flex; flex-direction: column; gap: 14px; }
    .allocation .section-head { justify-content: space-between; }
    .alloc-bar { display: flex; gap: 3px; height: 8px; }
    .alloc-seg { border-radius: 999px; min-width: 3px; }
    .alloc-empty { height: 8px; border-radius: 999px; background: var(--fill); }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 11px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .legend-item .dot { width: 5px; height: 5px; border-radius: 50%; }
    .legend-item .sym { color: var(--secondary); }
    .legend-item .pct { font-variant-numeric: tabular-nums; }

    /* Tables */
    .table-card { display: flex; flex-direction: column; overflow: hidden; container-type: inline-size; }
    .table-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 20px 10px;
      flex-wrap: wrap;
    }
    .tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .chip {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: var(--fill);
      color: var(--text);
      font-size: 11px;
      padding: 7px 11px;
      cursor: pointer;
    }
    .chip:hover { background: var(--separator); }
    /* The watchlist's Price / MCap switch: underlined text tabs, as on iOS. */
    .value-tabs { display: inline-flex; gap: 16px; margin-right: 6px; }
    .value-tab {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--secondary);
      font-size: 12px;
      padding: 7px 0;
      cursor: pointer;
      position: relative;
    }
    .value-tab:hover { color: var(--text); }
    .value-tab[aria-selected="true"] { color: var(--text); }
    .value-tab[aria-selected="true"]::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: var(--text);
    }
    /* Sort menu + map button, the iOS watchlist header controls. */
    .icon-btn {
      appearance: none;
      border: 0;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--fill);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
    }
    .icon-btn:hover, .icon-btn[aria-expanded="true"] { background: var(--separator); }
    .icon-btn:disabled { opacity: 0.4; cursor: default; }
    .icon-btn .aa { font-size: 12px; letter-spacing: -0.2px; }
    .menu {
      position: fixed;
      z-index: 20;
      min-width: 200px;
      padding: 6px;
      border-radius: 14px;
      background: var(--raised);
      box-shadow: inset 0 0 0 1px var(--separator);
      display: grid;
    }
    .menu-item {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--text);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 9px 10px;
      border-radius: 9px;
      font-size: 13px;
      text-align: left;
      cursor: pointer;
    }
    .menu-item:hover { background: var(--fill); }
    .menu-mark { color: var(--secondary); min-width: 12px; text-align: right; }
    .menu-sep { height: 1px; background: var(--separator); margin: 4px 6px; }

    /* Watch map (WatchlistHeatMapSheet). */
    .watchmap { width: 100%; max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
    .watchmap[hidden] { display: none; }
    .map-head { display: flex; align-items: center; gap: 12px; }
    .map-heading { flex: 1 1 auto; min-width: 0; }
    .map-kicker { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: color-mix(in srgb, var(--text) 58%, transparent); }
    .map-title { font-size: 28px; letter-spacing: -0.4px; margin-top: 4px; }
    .map-cap { text-align: right; white-space: nowrap; }
    .map-cap .k { font-size: 10px; letter-spacing: 1.2px; color: color-mix(in srgb, var(--text) 45%, transparent); }
    .map-cap .v { font-size: 17px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .map { position: relative; height: max(420px, calc(100vh - 160px)); border-radius: 22px; overflow: hidden; background: rgba(0, 0, 0, 0.18); }
    .tile {
      position: absolute;
      appearance: none;
      border: 0;
      margin: 0;
      padding: 0;
      font: inherit;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.32);
      cursor: pointer;
      overflow: hidden;
      transition: background-color 0.3s ease, filter 0.15s ease;
    }
    .tile:hover { filter: brightness(1.08); }
    .tile .badge { flex: 0 0 auto; }
    .tile .t-sym, .tile .t-pct, .tile .t-abbr { line-height: 1.1; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .tile .t-pct { opacity: 0.94; }

    tbody tr { cursor: pointer; }
    tbody tr:focus-visible { outline: 2px solid var(--text); outline-offset: -2px; border-radius: 0; }
    .table-scroll {
      position: relative;
      overflow-x: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--faint) transparent;
      padding-bottom: 6px;
    }
    /* Fixed layout: numeric columns have set widths and the asset column
       takes what's left (names ellipsize), so a long name can never push
       the price column past the card edge. */
    table { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
    .col-price { width: 120px; }
    .col-change { width: 80px; }
    .col-pnl { width: 80px; }
    .col-yield { width: 92px; }
    .col-cap { width: 100px; }
    .col-trend { width: 112px; }
    .col-value { width: 132px; }
    .watch-table .col-value { width: 140px; }
    /* The column header is its own table above the scroller (same fixed
       column widths), not a sticky row inside it: sticky table cells let
       rows peek through above them in WebKit while scrolling. */
    .table-columns { flex: 0 0 auto; }
    .table-columns[hidden] { display: none; }
    th {
      background: var(--surface);
      text-align: left;
      padding: 0;
      font-weight: inherit;
      box-shadow: inset 0 -1px 0 var(--hairline);
      white-space: nowrap;
    }
    th.num { text-align: right; }
    .th-label, .th-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 8px 12px;
      font-size: 10px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .th-btn { appearance: none; border: 0; background: transparent; cursor: pointer; border-radius: 6px; }
    .th-btn:hover, th[aria-sort="ascending"] .th-btn, th[aria-sort="descending"] .th-btn { color: var(--text); }
    .th-arrow { width: 8px; font-size: 9px; letter-spacing: 0; }
    th:first-child .th-btn, th:first-child .th-label { padding-left: 20px; }
    th:last-child .th-btn, th:last-child .th-label { padding-right: 20px; }
    td {
      padding: 12px;
      border-top: 1px solid var(--hairline);
      font-size: 14px;
      white-space: nowrap;
      vertical-align: middle;
    }
    tbody tr:first-child td { border-top: 0; }
    td:first-child { padding-left: 20px; }
    td:last-child { padding-right: 20px; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr { transition: background-color 0.12s ease; }
    tbody tr:hover { background: var(--row-hover); }
    .asset { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .asset-copy { flex: 1 1 auto; min-width: 0; overflow: hidden; }
    .asset-name { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
    .asset-sub { font-size: 12px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    .value-main { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
    .value-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .value-sub:empty { display: none; }
    .mini { width: 88px; height: 28px; display: flex; align-items: center; }
    .mini svg { display: block; overflow: visible; }
    .debt-bar { display: flex; gap: 1px; width: 88px; height: 4px; }
    .debt-bar span { height: 100%; border-radius: 2px; opacity: 0.85; }
    .dash { color: var(--faint); }
    .only-compact { display: none; }
    .hide-pnl .col-pnl, .hide-yield .col-yield { display: none; }
    .empty {
      padding: 26px 20px 30px;
      color: var(--secondary);
      font-size: 13px;
      text-align: center;
    }

    /* Coin badges, same shapes as CoinBadge / LetterBadge */
    .badge {
      position: relative;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }
    .badge-letter {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #FFFFFF;
      font-size: 18px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--tint) 95%, transparent), color-mix(in srgb, var(--tint) 55%, transparent));
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25);
    }
    .badge.has-img .badge-letter { visibility: hidden; }
    .badge-img { position: relative; width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }
    .badge.shape-rounded .badge-img, .badge.shape-rounded .badge-letter { border-radius: 22.5%; }
    .badge.shape-free .badge-img { border-radius: 0; object-fit: contain; }
    .badge.cash { color: #FFFFFF; font-size: 19px; }
    .badge.cash.usd { background: var(--usd); }
    .badge.cash.eur { background: var(--eur); }

    /* Asset detail: CoinDetailView's stack on the left, its market
       overview card on the right. */
    .dashboard[hidden], .detail[hidden] { display: none; }
    .detail {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding-top: 4px;
    }
    .detail-main { min-width: 0; }
    .detail-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .back-btn {
      appearance: none;
      border: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--fill);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: 0 0 auto;
      margin-right: 4px;
    }
    .back-btn:hover { background: var(--separator); }
    .detail-head .badge { width: 44px; height: 44px; }
    .detail-title { min-width: 0; flex: 1 1 auto; }
    .detail-name { font-size: 20px; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .detail-sym { font-size: 12px; color: var(--secondary); margin-top: 4px; }
    .detail-pill { display: flex; align-items: baseline; gap: 6px; font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .detail-pill .chg-usd, .detail-pill .chg-tf { color: var(--muted); }
    .detail-pill .chg-tf { font-size: 10px; }
    .cash-tag {
      font-size: 11px;
      letter-spacing: 1.8px;
      padding: 6px 10px;
      border-radius: 999px;
      color: color-mix(in srgb, var(--text) 70%, transparent);
      background: color-mix(in srgb, var(--text) 10%, transparent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 20%, transparent);
    }
    .detail-hero { margin-top: 18px; outline: none; }
    .detail-hero.toggles { cursor: pointer; }
    .detail-hero-label { font-size: 12px; color: color-mix(in srgb, var(--text) 45%, transparent); min-height: 15px; }
    .detail-hero-value {
      font-size: clamp(38px, 4.4vw, 52px);
      letter-spacing: -1.5px;
      line-height: 1.12;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 4px;
    }
    .detail-rows { display: grid; gap: 8px; margin-top: 16px; padding-top: 10px; border-top: 0.5px solid var(--separator); }
    .detail-rows:empty, .debt-break:empty { display: none; }
    .detail-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .detail-row .label { font-size: 13px; color: var(--muted); }
    .detail-row .val { font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .detail-row .foot { font-size: 12px; color: color-mix(in srgb, var(--text) 45%, transparent); margin-right: 8px; font-variant-numeric: tabular-nums; }
    .debt-break { display: grid; gap: 12px; margin-top: 16px; padding-top: 12px; border-top: 0.5px solid var(--separator); }
    .debt-bar-lg { display: flex; gap: 2px; height: 10px; }
    .debt-bar-lg span { border-radius: 4px; opacity: 0.85; }
    .debt-cells { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .debt-cell .k { font-size: 9px; letter-spacing: 1.4px; text-transform: uppercase; color: color-mix(in srgb, var(--text) 45%, transparent); }
    .debt-cell .v { font-size: 15px; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .debt-cell .p { font-size: 10px; color: color-mix(in srgb, var(--text) 45%, transparent); margin-top: 2px; }
    .detail-chart-head { display: flex; justify-content: space-between; margin-top: 26px; }
    .detail-chart-head .micro { font-size: 11px; letter-spacing: 2px; }
    .detail-chart { height: 230px; margin: 10px -4px 14px; }
    @media (min-width: 1180px) and (min-height: 820px) {
      /* The fixed-viewport dashboard layout doesn't apply to the detail. */
      body.detail-open, html:has(body.detail-open) { overflow: auto; height: auto; }
      body.detail-open .app { height: auto; }
    }
    .detail-stats { padding: 20px; display: flex; flex-direction: column; gap: 18px; }
    .detail-stats[hidden] { display: none; }
    @media (min-width: 1000px) {
      .detail { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); align-items: start; }
      .detail-stats { margin-top: 56px; }
    }

    /* Container-driven column dropping; at phone widths the rows become the
       app's list rows (name / "amount SYM · price", sparkline, value / %). */
    /* Thresholds keep the asset column at ~210px or more. */
    @container (max-width: 830px) {
      .holdings-table .col-yield { display: none; }
    }
    @container (max-width: 740px) {
      .holdings-table .col-pnl { display: none; }
    }
    @container (max-width: 660px) {
      .holdings-table .col-price { display: none; }
    }
    @container (max-width: 650px) {
      .watch-table .col-cap { display: none; }
    }
    @container (max-width: 545px) {
      .table-columns { display: none; }
      .col-price, .col-change, .col-cap { display: none; }
      .only-wide { display: none; }
      .only-compact { display: inline; }
      td { padding: 14px 6px; }
      td:first-child { padding-left: 16px; }
      td:last-child { padding-right: 16px; }
      .col-trend { width: 66px; }
      .col-value, .watch-table .col-value { width: 124px; }
      .badge { width: 40px; height: 40px; }
      .asset-name, .value-main { font-size: 16px; }
      .mini, .mini svg { width: 54px; height: 26px; }
      .debt-bar { width: 50px; }
    }

    @media (min-width: 1180px) {
      .dashboard {
        grid-template-columns: minmax(0, 1.6fr) minmax(340px, 1fr);
        grid-template-areas: "hero overview" "holdings watchlist";
        column-gap: 28px;
        row-gap: 24px;
      }
      .overview { align-self: start; }
    }
    /* Tall desktop windows: the dashboard fits the viewport and each list
       scrolls inside its own card. */
    @media (min-width: 1180px) and (min-height: 820px) {
      html, body { height: 100%; overflow: hidden; }
      .app { height: 100vh; display: flex; flex-direction: column; padding-bottom: 20px; }
      .dashboard { flex: 1 1 auto; min-height: 0; grid-template-rows: auto minmax(0, 1fr); }
      .table-card { min-height: 0; }
      .table-scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
      .chart { height: clamp(170px, calc(100vh - 640px), 280px); }
    }
    @media (min-width: 760px) and (max-width: 1179px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .app { padding-left: 16px; padding-right: 16px; }
      .status-text { display: none; }
      .brand-name { font-size: 20px; }
      .net { font-size: clamp(38px, 12vw, 58px); }
      .chart { height: 180px; }
      .stat-value { font-size: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .chart-svg.reveal { animation: none; }
      .chart-live.pulse::after { animation: none; }
      .seg-thumb, .chart, tbody tr { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">

        <h1 class="brand-name">Price</h1>

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>

          <div class="chart no-series detail-chart" id="detailChart" role="img" aria-label="Price chart"></div>

  <script>
  'use strict';
  (() => {
    const $ = (id) => document.getElementById(id);
    const finite = (n) => typeof n === 'number' && Number.isFinite(n);
    const DASH = '—';
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)');

    // Opened from the dashboard link (#r=<record>&k=<key>): read the
    // encrypted iCloud snapshot and reprice it live, so the page keeps
    // working while the phone sleeps.
    // The key arrives once in the link's fragment, moves into this browser's
    // storage, and is stripped from the address bar so screenshots, screen
    // shares and copied URLs never carry it. `#r=<record>` stays, so reloads
    // and bookmarks keep working in this browser.
    const cloudParams = (() => {
      const params = new URLSearchParams(location.hash.slice(1));
      const record = params.get('r');
      if (!record || !/^[A-Za-z0-9_-]+$/.test(record)) return null;
      const storeKey = 'PriceCloudKey.' + record;
      let key = params.get('k');
      try {
        if (key) {
          localStorage.setItem(storeKey, key);
          if (localStorage.getItem(storeKey) === key) {
            const asset = params.get('a');
            history.replaceState(null, '', location.pathname + location.search + '#r=' + record + (asset ? '&a=' + encodeURIComponent(asset) : ''));
          }
        } else {
          key = localStorage.getItem(storeKey);
        }
      } catch (_) {}
      return { record, key: key || null, storeKey };
    })();
    const CK_BASE = 'https://api.apple-cloudkit.com/database/1/iCloud.com.pie.CryptoFolio/production/public';
    const CK_TOKEN = 'ca55220cc6f0310c62b41f22d0bd32b45253c39d3dd07da9638413d8867719dc';
    // Stamped by Tools/deploy-dashboard.sh, which also writes version.txt.
    const BUILD = 'ca047dfd5215';

    let state = null;
    let inFlight = false;
    let pollTimer = 0;
    let failures = 0;
    let linkExpired = false;
    let linkMessage = '';

    // ---------- Theme & trend colours (mirrors AppTheme.trend) ----------
    const THEMES = {
      dark: { canvas: '#000000', text: '#F5F5F5' },
      light: { canvas: '#FBFCF9', text: '#171A18' }
    };
    if (!/^(dark|light)$/.test(document.documentElement.dataset.theme || '')) {
      document.documentElement.dataset.theme = prefersLight.matches ? 'light' : 'dark';
    }
    let theme = { name: document.documentElement.dataset.theme === 'light' ? 'light' : 'dark', up: '#00D222', down: '#FF2C2C', text: '#F5F5F5', canvas: '#000000' };
    theme.text = THEMES[theme.name].text;
    theme.canvas = THEMES[theme.name].canvas;

    function hexRGB(value) {
      if (!/^#[0-9a-fA-F]{6}$/.test(String(value || ''))) return null;
      const n = parseInt(value.slice(1), 16);
      return { r: ((n >> 16) & 255) / 255, g: ((n >> 8) & 255) / 255, b: (n & 255) / 255 };
    }
    function rgbHex(c) {
      const h = (v) => Math.round(Math.max(0, Math.min(1, v)) * 255).toString(16).padStart(2, '0');
      return ('#' + h(c.r) + h(c.g) + h(c.b)).toUpperCase();
    }
    function relLuminance(c) {
      const lin = (v) => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
      return 0.2126 * lin(c.r) + 0.7152 * lin(c.g) + 0.0722 * lin(c.b);
    }
    function contrast(a, b) {
      const la = relLuminance(a), lb = relLuminance(b);
      return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
    }
    // AppTheme.trend: glare-bright picks are scaled down to luma 0.6 so the
    // page shows the same tone the app paints (#00FF29 -> #00D222).
    function trendForUse(c) {
      const luma = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
      if (luma <= 0.6 || luma <= 0) return c;
      const k = 0.6 / luma;
      return { r: c.r * k, g: c.g * k, b: c.b * k };
    }
    // Last resort for a pick that still vanishes into the canvas: darken on
    // the light canvas, lighten on the black one.
    function canvasSafe(c, canvas, dark) {
      if (contrast(c, canvas) >= 1.6) return c;
      return dark
        ? { r: c.r * 0.5 + 0.45, g: c.g * 0.5 + 0.45, b: c.b * 0.5 + 0.45 }
        : { r: c.r * 0.34 + 0.04, g: c.g * 0.34 + 0.04, b: c.b * 0.34 + 0.06 };
    }
    function resolveTrend(hex, fallback, base, dark) {
      const c = hexRGB(hex) || hexRGB(fallback);
      return rgbHex(canvasSafe(trendForUse(c), hexRGB(base.canvas), dark));
    }
    function applyTheme() {
      const d = (state && state.display) || {};
      const name = d.resolvedAppearance === 'light' ? 'light' : 'dark';
      const base = THEMES[name];
      const dark = name === 'dark';
      const next = {
        name,
        text: base.text,
        canvas: base.canvas,
        up: resolveTrend(d.upColorHex, '#00FF29', base, dark),
        down: resolveTrend(d.downColorHex, '#FF2C2C', base, dark)
      };
      const changed = next.name !== theme.name || next.up !== theme.up || next.down !== theme.down;
      theme = next;
      const root = document.documentElement;
      if (root.dataset.theme !== name) root.dataset.theme = name;
      root.style.setProperty('--up', next.up);
      root.style.setProperty('--down', next.down);
      $('themeColorMeta').setAttribute('content', base.canvas);
      return changed;
    }

    // ---------- Formatting: ports of the app's formatters ----------
    // (PortfolioView.swift / Denomination.swift). The phone pre-formats
    // everything it sends; these produce the same strings for values the
    // page computes itself (chart tooltip, live repricing).
    let fmtDisplay = { currency: 'USD', usdPerEUR: 1.1 };
    const nfCache = new Map();
    function nf(min, max) {
      const locale = fmtDisplay.locale || undefined;
      const key = locale + '|' + min + '|' + max;
      let f = nfCache.get(key);
      if (!f) {
        const opts = { minimumFractionDigits: min, maximumFractionDigits: Math.max(min, max), useGrouping: true };
        try { f = new Intl.NumberFormat(locale, opts); } catch (_) { f = new Intl.NumberFormat(undefined, opts); }
        nfCache.set(key, f);
      }
      return f;
    }
    function displayParts(usd) {
      return fmtDisplay.currency === 'EUR'
        ? { v: usd / Math.max(fmtDisplay.usdPerEUR || 1.1, 0.5), s: '€' }
        : { v: usd, s: '$' };
    }
    function signed(v, sym, body) {
      return v < 0 ? '-' + sym + body.replace(/^[-−]/, '') : sym + body;
    }
    function denomOn() {
      return !!(fmtDisplay.denominationSymbol && finite(fmtDisplay.denominationPriceUSD) && fmtDisplay.denominationPriceUSD > 0);
    }
    function denomFmt(usd) {
      const v = usd / fmtDisplay.denominationPriceUSD;
      const a = Math.abs(v);
      const digits = a >= 1000 ? 0 : a >= 1 ? 2 : a >= 0.01 ? 4 : 6;
      return nf(digits === 0 ? 0 : Math.min(digits, 2), digits).format(v) + ' ' + fmtDisplay.denominationSymbol;
    }
    function fiatUSD(usd) {
      const { v, s } = displayParts(usd);
      return signed(v, s, nf(2, Math.abs(v) >= 1 ? 2 : 4).format(v));
    }
    function fmtUSD(usd) {
      if (!finite(usd)) return DASH;
      return denomOn() ? denomFmt(usd) : fiatUSD(usd);
    }
    const SUBSCRIPT = '₀₁₂₃₄₅₆₇₈₉';
    function decimalSeparator() {
      const part = nf(1, 1).formatToParts(1.5).find((p) => p.type === 'decimal');
      return part ? part.value : '.';
    }
    function tinyFiat(v, sym) {
      const a = Math.abs(v);
      if (!(a > 0 && a < 0.0001)) return null;
      const zeros = Math.ceil(-Math.log10(a)) - 1;
      if (zeros < 4) return null;
      const rounded = Math.round(a * Math.pow(10, zeros + 4));
      if (!(rounded > 0 && rounded < 10000)) return null;
      const sig = String(rounded).replace(/0+$/, '');
      const sub = String(zeros).split('').map((c) => SUBSCRIPT[+c]).join('');
      return (v < 0 ? '-' + sym : sym) + '0' + decimalSeparator() + '0' + sub + sig;
    }
    function fmtPrice(usd) {
      if (!finite(usd)) return DASH;
      if (denomOn()) return denomFmt(usd);
      const { v, s } = displayParts(usd);
      const tiny = tinyFiat(v, s);
      if (tiny) return tiny;
      const a = Math.abs(v);
      return signed(v, s, nf(2, a >= 1 ? 2 : a >= 0.01 ? 5 : 8).format(v));
    }
    const TIERS = [[1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'k']];
    const compactDigits = (a) => (a >= 100 ? 0 : a >= 10 ? 1 : 2);
    function compactFiat(v, sym) {
      const a = Math.abs(v);
      let tier = TIERS.findIndex((t) => a >= t[0]);
      if (tier < 0) tier = TIERS.length - 1;
      let scaled = v / TIERS[tier][0];
      let digits = compactDigits(Math.abs(scaled));
      while (tier > 0) {
        const step = Math.pow(10, digits);
        if (Math.abs(Math.round(scaled * step) / step) < 1000) break;

    function renderHero() {

    function renderSegmented(el, options, selected, onPick) {

    // ---------- Asset detail (CoinDetailView) ----------
    const detail = {

    async function loadAssetSeries(row, range) {
      const cacheKey = row.priceKey + '|' + range;
      const have = detail.series.get(cacheKey);
      if ((have && Date.now() - have.at < 120000) || detail.loading.has(cacheKey)) return;

        } else if (/^cg:[a-z0-9-]+$/.test(key)) {

          const end = all.length ? all[all.length - 1].t : 0;

        } else {

      const nowT = Date.now() / 1000;

      else copy.push({ t: nowT, v: price });

    function renderDetail() {

    // ---------- Views & routing: dashboard, asset detail, watch map ----------
    // `#r=<record>` is the dashboard, `&a=h:<id>` / `&a=w:<id>` an asset

    let view = 'dashboard';

    function routeHash(asset) {

    function navigate(asset) {

    function openDetail(kind, id) { navigate(kind + ':' + id); }
    function openMap() { navigate('map'); }

    function goBack() {

    // Back/forward and reloads land on the right view.
    function syncRoute() {

    }

    // ---------- Watch map (WatchlistHeatMapSheet) ----------
    const mapTiles = new Map();
    // Same weights as heatMapWeight: compressed market cap, then volume,
    // then price, so every watched asset stays discoverable.
    function heatWeight(w, index) {
      const compressed = (raw) => (finite(raw) && raw > 0 ? Math.max(10, Math.pow(raw, 0.22)) : 1);
      if (w.marketCapUSD > 0) return compressed(w.marketCapUSD);
      if (w.quoteVolume24hUSD > 0) return compressed(w.quoteVolume24hUSD);
      if (w.volume24h > 0 && w.priceUSD > 0) return compressed(w.volume24h * w.priceUSD);
      if (w.priceUSD > 0) return compressed(w.priceUSD);
      return 10 + Math.max(0, 24 - index) / 6;
    }
    // WatchTreemapLayout: losers / winners / neutral get their own blocks
    // when each is big enough, then balanced binary splits.
    function treemap(items, rect) {
      const groupWeight = (list) => list.reduce((sum, item) => sum + item.weight, 0);
      function split(list, r) {
        if (!list.length) return [];
        if (list.length === 1) return [{ item: list[0], rect: r }];
        const total = groupWeight(list);
        if (!(total > 0)) return [];
        let index = 1;
        if (list.length > 2) {
          let running = 0, bestDelta = Infinity;
          for (let i = 1; i < list.length; i++) {
            running += list[i - 1].weight;
            const delta = Math.abs(total * 0.5 - running);
            if (delta <= bestDelta) { bestDelta = delta; index = i; } else break;
          }
          index = Math.max(1, Math.min(list.length - 1, index));
        }
        const first = list.slice(0, index), second = list.slice(index);
        const ratio = groupWeight(first) / total;
        let a, b;
        if (r.w >= r.h) {
          a = { x: r.x, y: r.y, w: r.w * ratio, h: r.h };
          b = { x: r.x + a.w, y: r.y, w: Math.max(0, r.w - a.w), h: r.h };
        } else {
          a = { x: r.x, y: r.y, w: r.w, h: r.h * ratio };
          b = { x: r.x, y: r.y + a.h, w: r.w, h: Math.max(0, r.h - a.h) };
        }
        return split(first, a).concat(split(second, b));
      }
      const clean = items.filter((i) => finite(i.weight) && i.weight > 0);
      if (!clean.length || rect.w <= 0 || rect.h <= 0) return [];
      const losers = clean.filter((i) => (i.pct || 0) < -0.005);
      const winners = clean.filter((i) => (i.pct || 0) > 0.005);
      const neutral = clean.filter((i) => !finite(i.pct) || Math.abs(i.pct) <= 0.005);
      const groups = [losers, winners, neutral].filter((g) => g.length);
      const total = groupWeight(clean);
      if (!(groups.length > 1 && groups.every((g) => groupWeight(g) / total >= 0.14))) return split(clean, rect);
      let core = Object.assign({}, rect), neutralRect = null;
      if (neutral.length) {
        const share = Math.min(0.16, Math.max(0.07, groupWeight(neutral) / total));
        if (rect.w >= rect.h) {
          neutralRect = { x: rect.x + rect.w * (1 - share), y: rect.y, w: rect.w * share, h: rect.h };
          core.w = Math.max(0, rect.w - neutralRect.w);
        } else {
          neutralRect = { x: rect.x, y: rect.y + rect.h * (1 - share), w: rect.w, h: rect.h * share };
          core.h = Math.max(0, rect.h - neutralRect.h);
        }
      }
      let out = [];
      if (losers.length && winners.length) {
        const share = groupWeight(losers) / (groupWeight(losers) + groupWeight(winners));
        let a, b;
        if (core.w >= core.h) {
          a = { x: core.x, y: core.y, w: core.w * share, h: core.h };
          b = { x: core.x + a.w, y: core.y, w: Math.max(0, core.w - a.w), h: core.h };
        } else {
          a = { x: core.x, y: core.y, w: core.w, h: core.h * share };
          b = { x: core.x, y: core.y + a.h, w: core.w, h: Math.max(0, core.h - a.h) };
        }
        out = split(losers, a).concat(split(winners, b));
      } else {
        out = split(losers.length ? losers : winners, core);
      }
      return neutralRect ? out.concat(split(neutral, neutralRect)) : out;
    }
    // Tile fill strengthens with the move (up to 8 %), like heatFill; the
    // glyph ink is whichever of white / near-black reads on that fill.
    function heatFill(pct) {
      const neutral = !finite(pct) || Math.abs(pct) < 0.005;
      const base = hexRGB(neutral ? theme.text : (pct >= 0 ? theme.up : theme.down));
      const alpha = neutral ? 0.28 : 0.58 + Math.min(1, Math.abs(pct) / 8) * 0.34;
      const canvas = hexRGB(theme.canvas);
      const mixed = { r: base.r * alpha + canvas.r * (1 - alpha), g: base.g * alpha + canvas.g * (1 - alpha), b: base.b * alpha + canvas.b * (1 - alpha) };
      const white = contrast({ r: 1, g: 1, b: 1 }, mixed);
      const ink = white >= 3 || white >= contrast({ r: 0.043, g: 0.043, b: 0.043 }, mixed) ? '#FFFFFF' : '#0B0B0B';
      return { fill: 'rgba(' + Math.round(base.r * 255) + ',' + Math.round(base.g * 255) + ',' + Math.round(base.b * 255) + ',' + alpha.toFixed(3) + ')', ink };
    }
    function renderMap() {
      if (view !== 'map' || !state) return;
      const all = state.watches || [];
      const rows = filterRows(all, filterAvailable(all) ? watchFilter() : 'all');
      const items = rows.map((w, i) => ({ w, id: w.id || w.symbol, weight: heatWeight(w, i), pct: changeOf(w) }))
        .sort((a, b) => (b.weight - a.weight) || a.w.symbol.localeCompare(b.w.symbol));
      setText($('mapTitle'), items.length + ' watching');
      const knownCap = items.reduce((sum, i) => sum + (i.w.marketCapUSD > 0 ? i.w.marketCapUSD : 0), 0);
      setHTML($('mapCap'), knownCap > 0 ? '<div class="k">KNOWN CAP</div><div class="v">' + esc(fmtCompactUSD(knownCap)) + '</div>' : '');
      const area = $('mapArea');
      const W = area.clientWidth, H = area.clientHeight;
      const layouts = treemap(items, { x: 0, y: 0, w: W, h: H });
      const seen = new Set();
      for (const { item, rect } of layouts) {
        const gap = rect.w > 6 && rect.h > 6 ? 1 : 0;
        const left = rect.x <= 0.5 ? 0 : gap, top = rect.y <= 0.5 ? 0 : gap;
        const right = rect.x + rect.w >= W - 0.5 ? 0 : gap, bottom = rect.y + rect.h >= H - 0.5 ? 0 : gap;
        const x = rect.x + left, y = rect.y + top;
        const w = Math.max(0, rect.w - left - right), h = Math.max(0, rect.h - top - bottom);
        const key = item.id + '|' + theme.name + '|' + iconsVersion;
        seen.add(key);
        let tile = mapTiles.get(key);
        if (!tile) {
          tile = document.createElement('button');
          tile.type = 'button';
          tile.className = 'tile';
          tile.dataset.id = item.id;
          tile.innerHTML = badgeHTML(item.w) + '<span class="t-abbr"></span><span class="t-sym"></span><span class="t-pct"></span>';
          tile.addEventListener('click', () => openDetail('w', tile.dataset.id));
          area.appendChild(tile);
          mapTiles.set(key, tile);
        }
        const minSide = Math.min(w, h);
        const canMark = w >= 12 && h >= 12, canSymbol = w >= 38 && h >= 48, canPct = w >= 50 && h >= 74;
        const badgeSize = !canSymbol ? Math.max(10, Math.min(22, minSide * 0.72))
          : canPct ? Math.min(34, Math.max(20, Math.min(w * 0.26, h * 0.28)))
          : Math.min(28, Math.max(16, Math.min(w * 0.30, h * 0.34)));
        const { fill, ink } = heatFill(item.pct);
        const pctText = finite(item.pct) ? fmtPct(item.pct) : '-';
        Object.assign(tile.style, {
          left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px',
          borderRadius: Math.max(3, Math.min(12, minSide * 0.12)) + 'px',
          background: fill, color: ink, gap: (canPct ? 4 : 3) + 'px'
        });
        tile.setAttribute('aria-label', (item.w.displayName || item.w.symbol) + ', ' + item.w.symbol + ', ' + (finite(item.pct) ? pctText : 'change unavailable'));
        const badge = tile.querySelector('.badge');
        const showBadge = canMark && (canSymbol || minSide >= 18);
        badge.style.display = showBadge ? '' : 'none';
        badge.style.width = badge.style.height = badgeSize + 'px';
        // LetterBadge / cash glyph scale with the badge (size * 0.5).
        const glyph = badge.querySelector('.badge-letter') || (badge.classList.contains('cash') ? badge : null);
        if (glyph) glyph.style.fontSize = Math.round(badgeSize * 0.5) + 'px';
        const abbr = tile.querySelector('.t-abbr');
        abbr.style.display = canMark && !canSymbol && minSide < 18 && w * h >= 170 ? '' : 'none';
        abbr.style.fontSize = Math.max(7, minSide * 0.48) + 'px';
        setText(abbr, item.w.symbol.slice(0, 2));
        const sym = tile.querySelector('.t-sym');
        sym.style.display = canSymbol ? '' : 'none';
        sym.style.fontSize = (canPct ? Math.min(16, Math.max(11, Math.min(w * 0.16, h * 0.15))) : Math.min(14, Math.max(10, Math.min(w * 0.18, h * 0.22)))) + 'px';
        setText(sym, item.w.symbol);
        const pctEl = tile.querySelector('.t-pct');
        pctEl.style.display = canPct ? '' : 'none';
        pctEl.style.fontSize = Math.min(14, Math.max(10, Math.min(w * 0.14, h * 0.13))) + 'px';
        setText(pctEl, pctText);
      }
      for (const [key, tile] of mapTiles) {
        if (!seen.has(key)) { tile.remove(); mapTiles.delete(key); }
      }
      $('mapEmpty').hidden = items.length > 0;
    }

    function wireDetail() {
      detail.chart = makeChart($('detailChart'), 'dt');
      $('detailBack').addEventListener('click', goBack);
      $('mapBack').addEventListener('click', goBack);
      let mapFrame = 0;
      new ResizeObserver(() => {
        cancelAnimationFrame(mapFrame);
        mapFrame = requestAnimationFrame(renderMap);
      }).observe($('mapArea'));
      const cycleHero = () => {
        const row = detailRow();
        if (!row) return;
        const amount = detail.kind === 'h' ? row.amount : 0;
        const order = ['price'].concat(amount > 0 ? ['value'] : [], detail.kind === 'h' && row.apyEarnings30DUSD > 0 ? ['earnings'] : []);
        if (order.length < 2) return;
        const current = order.indexOf(detail.hero);
        detail.hero = order[(current + 1) % order.length];
        storageSet('PriceDetailHero.v1', detail.hero);
        renderDetail();
      };
      $('detailHero').addEventListener('click', cycleHero);
      $('detailHero').addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cycleHero(); } });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (watchMenuOpen) { watchMenuOpen = false; renderWatches(); return; }
        if (view !== 'dashboard') goBack();
      });
      window.addEventListener('popstate', syncRoute);
      // Rows open their asset page, by click or Enter.
      const openFromRow = (tr) => { if (tr && tr.dataset.kind && state) openDetail(tr.dataset.kind, tr.dataset.id); };
      document.addEventListener('click', (e) => {
        if (e.target.closest('button, a')) return;
        openFromRow(e.target.closest('tbody tr'));
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && e.target.matches && e.target.matches('tbody tr')) openFromRow(e.target);
      });
    }

    // ---------- Overview ----------
    function stat(label, value, cls, sub) {
      const none = !value;
      return '<div class="stat"><div class="micro">' + esc(label) + '</div>'
        + '<div class="stat-value ' + (none ? 'none' : (cls || '')) + '">' + esc(none ? DASH : value) + '</div>'
        + (sub ? '<div class="stat-sub">' + esc(sub) + '</div>' : '') + '</div>';
    }
    function renderOverview() {
      const s = state.summary;
      const t = s.text || {};
      // Like the app, figures only appear once they mean something: no
      // debt row without debt, no cost-basis/return without buy prices,
      // no yield figures until a holding has an APY set.
      const stats = [stat('Assets', t.totalValue)];
      if (t.debt) stats.push(stat('Debt', t.debt));
      stats.push(stat('24h change', t.change24h, trendClass(s.changePct24h)));
      if (t.costBasis) {
        stats.push(stat('Cost basis', t.costBasis));
        stats.push(stat('Total return', t.totalReturnPct, trendClass(s.totalPnLPctVsCost), t.totalReturnUSD));
      }
      if (t.hasApy) {
        stats.push(stat('30D earnings', t.yield30D, 'up'));
        stats.push(stat('Yield APY', t.apy, 'up'));
      }
      setHTML($('stats'), stats.join(''));

      const items = state.allocation || [];
      const total = items.reduce((sum, item) => sum + (finite(item.valueUSD) ? item.valueUSD : 0), 0);
      if (!(total > 0)) {
        setHTML($('allocationBar'), '<div class="alloc-empty" style="flex:1"></div>');
        setHTML($('allocationLegend'), '<span class="muted">No allocation yet</span>');
        return;
      }
      setHTML($('allocationBar'), items.map((item) =>
        '<div class="alloc-seg" title="' + esc(item.symbol + ' ' + fmtUSD(item.valueUSD)) + '" style="flex:' + (item.valueUSD / total).toFixed(5)
        + ' 1 0;background:' + safeColor(item.tint) + '"></div>').join(''));
      setHTML($('allocationLegend'), items.slice(0, 8).map((item) => {
        const share = (item.valueUSD / total) * 100;
        const pct = share < 1 ? '<1%' : Math.round(share) + '%';
        return '<span class="legend-item"><span class="dot" style="background:' + safeColor(item.tint) + '"></span>'
          + '<span class="sym">' + esc(item.symbol) + '</span><span class="pct">' + esc(pct) + '</span></span>';
      }).join(''));
    }

    // ---------- Tables ----------
    let iconsVersion = 0;
    function iconSource(sym) {
      const data = cloud.icons[sym + '@' + theme.name] || cloud.icons[sym];
      return data ? 'data:image/png;base64,' + data : null;
    }
    function badgeHTML(row) {
      const sym = String(row.symbol || '').toUpperCase();
      if (sym === 'USD' || sym === 'EUR') {
        return '<span class="badge cash ' + sym.toLowerCase() + '" aria-hidden="true">' + (sym === 'USD' ? '$' : '€') + '</span>';
      }
      const shape = ['circle', 'rounded', 'free'].includes(row.iconShape) ? row.iconShape : 'circle';
      const src = iconSource(sym);
      return '<span class="badge shape-' + shape + '" style="--tint:' + safeColor(row.tint) + '" aria-hidden="true">'
        + '<span class="badge-letter">' + esc(sym.slice(0, 1)) + '</span>'
        + (src ? '<img class="badge-img" src="' + src + '" alt="" decoding="async">' : '') + '</span>';
    }
    function debtBarHTML(row) {
      const gross = row.grossValueUSD, free = finite(row.freeCashUSD) ? row.freeCashUSD : row.effectiveValueUSD;
      if (!finite(gross) || !finite(free) || gross <= free + 0.5) return null;
      const freePct = Math.max(0, Math.min(100, (Math.max(0, free) / gross) * 100));
      return '<div class="debt-bar" title="' + esc('Free ' + fmtUSD(free) + ' · Debt ' + fmtUSD(gross - free)) + '">'
        + '<span style="width:' + freePct.toFixed(2) + '%;background:var(--up)"></span>'
        + '<span style="width:' + (100 - freePct).toFixed(2) + '%;background:var(--down)"></span></div>';
    }
    function slots(tr) {
      const map = {};
      tr.querySelectorAll('[data-s]').forEach((el) => { map[el.dataset.s] = el; });
      return map;
    }
    function reconcile(tbody, cache, items, keyOf, create, update) {
      const seen = new Set();
      const counts = new Map();
      let prev = null;
      for (const item of items) {
        const base = keyOf(item);
        const n = (counts.get(base) || 0) + 1;
        counts.set(base, n);
        const key = n > 1 ? base + '#' + n : base;
        seen.add(key);
        let tr = cache.get(key);
        if (!tr) { tr = create(item); cache.set(key, tr); }
        update(tr, item);
        const expected = prev ? prev.nextElementSibling : tbody.firstElementChild;
        if (tr !== expected) tbody.insertBefore(tr, expected);
        prev = tr;

      for (const [key, tr] of cache) {
        if (!seen.has(key)) { tr.remove(); cache.delete(key); }

    function sortHeader(cols, sort, attr) {

        const active = sort.mode === c.sort;
        const aria = active ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none';
        const arrow = active ? (sort.dir === 'asc' ? '↑' : '↓') : '';
        return '<th class="' + c.cls + '" aria-sort="' + aria + '"><button class="th-btn" type="button" ' + attr + '="' + c.sort + '">'
          + (c.cls.includes('num') ? '<span class="th-arrow">' + arrow + '</span>' + esc(c.label) : esc(c.label) + '<span class="th-arrow">' + arrow + '</span>')
          + '</button></th>';

        + '</div>';

    function numericSort(rows, dir, value, name) {
      return rows.sort((a, b) => {
        const av = value(a), bv = value(b);

        if (!finite(av)) return 1;

    const isHardware = (row) => String(row.priceKey || '').startsWith('hardware:');

    function filterAvailable(rows) {

    }
    const nameOf = (row) => String(row.displayName || row.name || row.symbol || '').toLocaleLowerCase();
    const changeOf = (row) => (finite(row.changePct1D) ? row.changePct1D : row.changePct24h);

    // Holdings
    const HOLDING_COLS = [
      { label: 'Asset', cls: 'col-asset', sort: 'name' },
      { label: 'Price', cls: 'num col-price', sort: 'price' },
      { label: '1D', cls: 'num col-change', sort: 'change' },
      { label: 'P/L', cls: 'num col-pnl', sort: 'pnl' },
      { label: '30D Yield', cls: 'num col-yield', sort: 'yield' },
      { label: 'Trend', cls: 'col-trend' },
      { label: 'Value', cls: 'num col-value', sort: 'value' }
    ];
    const HOLDING_SORT_KEY = 'CryptoFolioDesktopHoldingSort.v2';
    const HOLDING_FILTER_KEY = 'CryptoFolioDesktopHoldingFilter.v1';
    const HOLDING_MODES = { value: 'desc', change: 'desc', price: 'desc', pnl: 'desc', yield: 'desc', name: 'asc' };
    const holdingRows = new Map();
    let holdingRowsKey = '';

    function holdingSort() {
      const [mode, dir] = storageGet(HOLDING_SORT_KEY, 'value|desc').split('|');
      return HOLDING_MODES[mode] ? { mode, dir: dir === 'asc' ? 'asc' : 'desc' } : { mode: 'value', dir: 'desc' };

    function sortedHoldings(rows) {
      const { mode, dir } = holdingSort();

      const values = {
        value: (h) => h.effectiveValueUSD,
        change: changeOf,
        price: (h) => h.priceUSD,
        pnl: (h) => h.pnlPctVsCost,
        yield: (h) => (finite(h.apyEarnings30DUSD) && h.apyEarnings30DUSD > 0 ? h.apyEarnings30DUSD : null)
      };
      if (mode === 'name') return list.sort((a, b) => (dir === 'asc' ? 1 : -1) * nameOf(a).localeCompare(nameOf(b)));

    function createHoldingRow(h) {

    function updateHoldingRow(tr, h) {

      setText(s.change, t.change || DASH);
      setClass(s.pnl, 'num col-pnl ' + (t.pnl ? trendClass(h.pnlPctVsCost) : 'dash'));
      setText(s.pnl, t.pnl || DASH);

    function renderHoldings() {

    // Watchlist
    const WATCH_VALUE_KEY = 'PriceWatchValueMode.v1';

    function watchCols() {

        { label: 'Asset', cls: 'col-asset', sort: 'name' },

    const watchRows = new Map();
    let watchRowsKey = '';

    function watchSort() {

    // The iOS sort menu: the button's glyph shows the active mode.
    const ICON = (body) => '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';

      + [3, 10, 17].map((y) => [3, 10, 17].map((x) => '<rect x="' + x + '" y="' + y + '" width="5" height="5" rx="1.2"/>').join('')).join('') + '</svg>';
    const SORT_ITEMS = [['manual', 'Custom order'], ['change', 'Change'], ['marketCap', 'Market cap'], ['name', 'Name']];
    let watchMenuOpen = false;
    function sortMenuButton(sort) {

    // The menu lives on <body> (position: fixed) so the card's rounded

    function createWatchRow(w) {

    function updateWatchRow(tr, w) {

    function renderWatches() {

    // A classic (non-overlay) scrollbar narrows the body table; pad the

    function wireTables() {

        if (target.dataset.holdingSort) {

        } else if (target.dataset.watchSort) {

          if (cur.mode === mode) {

          // in their default direction.
          const mode = target.dataset.watchSortpick;
          const cur = watchSort();
          if (cur.mode === mode) {
            if (mode !== 'manual') storageSet(WATCH_SORT_KEY, mode + '|' + (cur.dir === 'asc' ? 'desc' : 'asc'));
          } else {
            storageSet(WATCH_SORT_KEY, mode + '|' + WATCH_MODES[mode]);
          }
          watchMenuOpen = false;
          renderWatches();
        } else if (target.hasAttribute('data-watch-reverse')) {
          const cur = watchSort();
          if (cur.mode !== 'manual') storageSet(WATCH_SORT_KEY, cur.mode + '|' + (cur.dir === 'asc' ? 'desc' : 'asc'));
          watchMenuOpen = false;
          renderWatches();
        } else if (target.hasAttribute('data-watch-map')) {

      document.addEventListener('load', (e) => {

        if (img.classList && img.classList.contains('badge-img')) img.parentElement.classList.add('has-img');
      }, true);

    // ---------- Render ----------
    function render() {

    function schedule(delay) {

    async function fetchWithTimeout(url, options, ms) {

    // ---------- Snapshot + live prices ----------

    const cloud = {

    const fieldValue = (record, name) => (record && record.fields && record.fields[name] ? record.fields[name].value : null);

    async function refreshSnapshot() {

            // phone. Forget what this browser kept for it.

            linkMessage = 'Link turned off';

              localStorage.removeItem(cloudParams.storeKey);

            // (link opened right after turning it on or tapping New).

          }

      }
      cloud.waiting = false;
      const updated = fieldValue(record, 'updatedAt');
      if (cloud.payload && updated === cloud.updated) return false;
      const sealed = fieldValue(record, 'payload');
      try {
        cloud.payload = await openSealed(sealed);
      } catch (_) {
        linkExpired = true;
        linkMessage = 'Link not valid';
        throw new Error('decrypt');
      }

      storageSet('PriceCloudSnapshot.' + cloudParams.record, sealed);
      return true;
    }
    async function refreshIcons() {
      const name = cloudParams.record + '-icons';
      const [meta] = await ckLookup([name], ['updatedAt']);
      const updated = fieldValue(meta, 'updatedAt');
      if (!updated || updated === cloud.iconsUpdated) return false;
      const [record] = await ckLookup([name]);
      const sealed = fieldValue(record, 'payload');
      if (!sealed) return false;
      cloud.icons = await openSealed(sealed);
      cloud.iconsUpdated = updated;
      iconsVersion += 1;
      storageSet('PriceCloudIcons.' + cloudParams.record, sealed);
      return true;
    }

    function priceTargets() {
      const keys = new Set(['EURUSDT']);
      const st = cloud.payload.state;
      for (const row of (st.holdings || []).concat(st.watches || [])) if (!row.isCash && row.priceKey) keys.add(row.priceKey);
      if (st.debt && st.debt.priceKey) keys.add(st.debt.priceKey);
      if (cloud.payload.denominationPriceKey) keys.add(cloud.payload.denominationPriceKey);
      const binance = [], coingecko = [];
      for (const key of keys) {
        if (/^[A-Z0-9]{2,20}USDT$/.test(key)) {
          if (!cloud.invalidBinance.has(key)) binance.push(key);
        } else if (/^cg:[a-z0-9-]+$/.test(key)) {
          coingecko.push(key.slice(3));
        }
      }
      return { binance, coingecko };
    }
    async function binanceTickers(symbols) {
      const bases = cloud.binanceBase ? [cloud.binanceBase] : ['https://api.binance.com', 'https://api.binance.us'];

        let res;
        try {
          res = await fetchWithTimeout(base + '/api/v3/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(symbols)));
        } catch (_) {
          continue;
        }
        if (res.status === 400 && symbols.length > 1) {
          // One unknown pair fails the whole batch: find it once, then skip it.
          const rows = [];
          await Promise.all(symbols.map(async (sym) => {
            try {
              const one = await fetchWithTimeout(base + '/api/v3/ticker/24hr?symbol=' + sym);
              if (one.ok) rows.push(await one.json());
              else if (one.status === 400) cloud.invalidBinance.add(sym);
            } catch (_) {}
          }));
          cloud.binanceBase = base;
          return rows;
        }
        if (!res.ok) continue;
        cloud.binanceBase = base;
        return res.json();
      }
      cloud.binanceBase = null;
      throw new Error('binance');
    }
    async function refreshPrices(includeCoinGecko) {
      const { binance, coingecko } = priceTargets();
      let ok = false;
      if (binance.length) {
        try {
          for (const row of await binanceTickers(binance)) {
            const price = parseFloat(row.lastPrice);
            if (!(price > 0)) continue;
            cloud.prices[row.symbol] = {
              price,
              change: parseFloat(row.priceChangePercent),
              high: parseFloat(row.highPrice),
              low: parseFloat(row.lowPrice),
              volume: parseFloat(row.volume),
              quoteVolume: parseFloat(row.quoteVolume)
            };
          }
          ok = true;
        } catch (_) {}
      } else {
        ok = true;
      }
      if (includeCoinGecko && coingecko.length) {
        try {
          const res = await fetchWithTimeout('https://api.coingecko.com/api/v3/simple/price?ids=' + encodeURIComponent(coingecko.join(','))
            + '&vs_currencies=usd&include_24hr_change=true&include_market_cap=true');
          if (res.ok) {
            const json = await res.json();
            for (const id of Object.keys(json)) {
              const q = json[id];
              if (!(q.usd > 0)) continue;
              cloud.prices['cg:' + id] = { price: q.usd, change: q.usd_24h_change, marketCap: q.usd_market_cap };

    }

    // Timeframes the phone never loaded: rebuild the aggregate here the way
    // buildTotalSparkline does for non-ALL ranges (same candle intervals,
    // union time grid, linear interpolation, flat cash/unpriced holdings,
    // debt as a flat baseline).
    const RANGE_SPEC = {
      '1H': { interval: '1m', limit: 60, days: '1', span: 3600 },
      '4H': { interval: '5m', limit: 48, days: '1', span: 14400 },
      '1D': { interval: '1h', limit: 24, days: '1', span: 86400 },
      '1W': { interval: '4h', limit: 42, days: '7', span: 604800 },
      '1M': { interval: '1d', limit: 30, days: '30', span: 2592000 }
    };
    const cgChartCache = new Map();
    const building = new Set();
    function downsample(points, limit) {
      if (points.length <= limit) return points;
      const step = (points.length - 1) / (limit - 1);
      return Array.from({ length: limit }, (_, i) => points[Math.round(i * step)]);
    }
    async function binanceKlines(symbol, interval, limit) {
      const base = cloud.binanceBase || 'https://api.binance.com';
      const res = await fetchWithTimeout(base + '/api/v3/klines?symbol=' + symbol + '&interval=' + interval + '&limit=' + limit, null, 10000);
      if (!res.ok) throw new Error('klines');
      return (await res.json()).map((r) => ({ t: r[0] / 1000, v: parseFloat(r[4]) })).filter((p) => finite(p.v));
    }
    async function coingeckoChart(id, days) {
      const key = id + '|' + days;
      const hit = cgChartCache.get(key);
      if (hit && Date.now() - hit.at < 300000) return hit.prices;
      const res = await fetchWithTimeout('https://api.coingecko.com/api/v3/coins/' + encodeURIComponent(id) + '/market_chart?vs_currency=usd&days=' + days, null, 10000);
      if (!res.ok) throw new Error('chart');
      const prices = ((await res.json()).prices || []).map((p) => ({ t: p[0] / 1000, v: p[1] })).filter((p) => finite(p.v));
      cgChartCache.set(key, { at: Date.now(), prices });
      return prices;
    }
    function aggregateHistory(byId, holdings, debtUSD) {
      const nowT = Date.now() / 1000;
      const series = holdings.map((h) => {
        const pts = (byId[h.id] || []).slice();
        if (pts.length && finite(h.priceUSD) && h.priceUSD > 0) pts.push({ t: nowT, v: h.priceUSD });
        return { amount: h.amount, pts, flat: finite(h.valueUSD) ? h.valueUSD : 0 };
      });
      const grid = Array.from(new Set(series.flatMap((s) => (s.pts.length > 1 ? s.pts.map((p) => p.t) : [])))).sort((a, b) => a - b);
      if (grid.length < 2) return [];
      const cursors = series.map(() => 1);
      return downsample(grid.map((t) => {
        let sum = 0;
        series.forEach((s, i) => {
          if (s.pts.length < 2) { sum += s.flat; return; }
          if (t <= s.pts[0].t) { sum += s.amount * s.pts[0].v; return; }
          let j = cursors[i];
          while (j < s.pts.length - 1 && s.pts[j].t < t) j++;
          cursors[i] = j;
          const a = s.pts[j - 1], b = s.pts[j];
          const f = b.t > a.t ? Math.min(1, Math.max(0, (t - a.t) / (b.t - a.t))) : 1;

    async function ensureHistory(range, profileKey) {

      if (have && Date.now() - have.at < 300000) return;
      building.add(key);
      const byId = {};
      try {
        await Promise.all((state.holdings || []).map(async (h) => {
          try {
            if (h.isCash) return;
            if (/^[A-Z0-9]{2,20}USDT$/.test(h.priceKey) && !cloud.invalidBinance.has(h.priceKey)) {
              byId[h.id] = await binanceKlines(h.priceKey, spec.interval, spec.limit);
            } else if (/^cg:[a-z0-9-]+$/.test(h.priceKey)) {
              const all = await coingeckoChart(h.priceKey.slice(3), spec.days);

      }
    }

    function liveStats(row, q) {

        low24hUSD: pick(q.low, row.low24hUSD),
        volume24h: pick(q.volume, row.volume24h),
        quoteVolume24hUSD: pick(q.quoteVolume, row.quoteVolume24hUSD)

    }
    function patchSpark(points, price) {

    // Another profile than the phone's active one: rebuild the state shape

    function profileBase(base, profile) {

    }
    function computeCloudState() {

      const profileKey = chosen ? chosen.id : 'active';
      const live = cloud.prices;
      const display = Object.assign({}, base.display);
      // "Auto" follows the computer this page is open on, not the phone.
      if (display.appAppearance === 'auto') display.resolvedAppearance = prefersLight.matches ? 'light' : 'dark';
      const fxQuote = live.EURUSDT;
